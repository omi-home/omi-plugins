# OMI Issue Form (DevTask-0047 #130). Required fields are the sections `omi ticket validate` checks.
name: FunctionalRequirement
description: Yêu cầu chức năng kiểm chứng được.
title: FunctionalRequirement-NNNN-
labels:
  - type:fr
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Kết quả cần đạt, một hai câu.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Parent
      description: Issue cha (sẽ gắn native sub-issue), bối cảnh, link quyết định.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope / Acceptance
      description: Hành vi yêu cầu và Acceptance Criteria dạng checklist `- [ ]`.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue chặn (native blocked-by link).
      value: "Blocked by: none"
    validations:
      required: false
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Điều kiện để đóng Issue.
      value: "- [ ] Acceptance Criteria được kiểm chứng"
    validations:
      required: false
