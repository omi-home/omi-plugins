# OMI Issue Form, model v2 (DevTask-0100 #309; frame: ChangeRequest-0013 §11). Required fields are
# the sections `omi ticket validate` checks when `github.model: v2`. A Doc has one form per
# variant; the `Doc kind` section of the body picks which one applies.
name: Doc - Regression Suite
description: Tài liệu sống của dự án.
title: Doc-NNNN-
type: Doc
body:
  - type: input
    id: doc-kind
    attributes: { label: Doc kind, description: Biến thể của Doc., value: Regression Suite }
    validations: { required: true }
  - type: textarea
    id: usage
    attributes: { label: Cách dùng, description: Cách dùng suite. }
    validations: { required: true }
  - type: textarea
    id: areas
    attributes:
      label: Khu vực tính năng
      description: "Mỗi khu vực một bảng ID | Steps | Expected | Priority | Nguồn (QATask #) | Cập nhật bởi (#CR)."
    validations: { required: true }
  - type: textarea
    id: change-log
    attributes: { label: Change log, description: Ghi bằng comment. }
    validations: { required: false }
