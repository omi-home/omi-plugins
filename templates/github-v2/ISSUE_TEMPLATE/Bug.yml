# OMI Issue Form, model v2 (DevTask-0100 #309; frame: ChangeRequest-0013 §11). Required fields are
# the sections `omi ticket validate` checks when `github.model: v2`.
name: Bug
description: Lỗi.
title: Bug-NNNN-
type: Bug
body:
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: Các bước tái hiện. }
    validations: { required: true }
  - type: textarea
    id: expected-actual
    attributes: { label: Expected / Actual, description: Mong đợi và thực tế. }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Mức độ nghiêm trọng.
      options: [critical, high, medium, low]
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment / commit, description: Môi trường và commit. }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: Ảnh, log. }
    validations: { required: false }
  - type: textarea
    id: found-in
    attributes: { label: Found in, description: "Found in: QATask #" }
    validations: { required: false }
