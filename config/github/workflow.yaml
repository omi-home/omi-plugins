# State machine of model v2 (ADR-0005 D2; ChangeRequest-0013 §9.3 + §5.2; DevTask-0103 #316).
# Single source of the statuses and transitions each issue type may have; `omi move` / `omi sync`
# read it (Feature-0039 #298).
# Workspace override: `github.workflow` in .omi-plugins/omi.config.yaml (merge rules: runtime/shared/workflow.ts).
#
# transition: from = status or "*"; to = status or list; by = po | coordinator | auto;
#   coordinator = only through `omi move`; po = only recorded by `sync`; auto = `sync` applies it when `when` holds.
# `when` (list of predicates, all must hold) is required for `auto` and forbidden otherwise.
# Blocked: a type with `blocked_returns_to` may enter Blocked from every open status (coordinator) and
# leaves it to `blocked_returns_to` (auto, blockers_done) unless it declares a transition from Blocked.
# Bug has Rework (PO decision 2026-11-21): §9.3 has Awaiting PO -> Rework, §5.2 had no Rework for Bug.
statuses:
  - Draft
  - Awaiting PO
  - Ready
  - In progress
  - In review
  - Testing
  - Acceptance
  - Rework
  - Blocked
  - Done

# Statuses in which the Issue is closed on GitHub.
closed_states: [Done]
# Types whose Issue `omi sync` never closes by itself, even in a closed state.
never_close: [Doc]

types:
  Epic:
    initial: Draft
    transitions:
      - { from: Draft, to: Awaiting PO, by: coordinator }
      - { from: Awaiting PO, to: [Ready, Rework], by: po }
      - { from: Rework, to: Awaiting PO, by: coordinator }
      - { from: Ready, to: In progress, by: auto, when: [{ any_child_in: [In progress] }] }
      - { from: In progress, to: Done, by: auto, when: [{ all_children_done: true }] }

  UserStory:
    initial: Draft
    blocked_returns_to: In progress
    transitions:
      - { from: Draft, to: Ready, by: auto, when: [{ parent_status_in: [Ready, In progress] }] }
      - { from: Draft, to: Awaiting PO, by: coordinator }
      - { from: Awaiting PO, to: [Ready, Rework], by: po }
      - { from: Ready, to: In progress, by: auto, when: [{ any_child_in: [In progress] }] }
      - {
          from: In progress,
          to: Testing,
          by: auto,
          when: [{ children_done: [DesignTask, DevTask] }],
        }
      - {
          from: Testing,
          to: Acceptance,
          by: auto,
          when: [{ children_done: [QATask] }, { no_open_child: [Bug] }],
        }
      - { from: Acceptance, to: [Done, Rework], by: po }
      - { from: Rework, to: [Awaiting PO, In progress], by: coordinator }
      - { from: "*", to: Blocked, by: coordinator }

  DesignTask:
    initial: Ready
    blocked_returns_to: Ready
    transitions:
      - { from: Ready, to: In progress, by: coordinator }
      - { from: In progress, to: In review, by: coordinator }
      - { from: In review, to: [Done, Awaiting PO], by: coordinator }
      - { from: Awaiting PO, to: [Done, Rework], by: po }
      - { from: Rework, to: In progress, by: coordinator }

  DevTask:
    initial: Ready
    blocked_returns_to: Ready
    transitions:
      - { from: Blocked, to: Ready, by: auto, when: [{ blockers_done: true }] }
      - { from: Ready, to: In progress, by: coordinator }
      - { from: In progress, to: In review, by: auto, when: [{ linked_pr: open_ready }] }
      - { from: In review, to: In progress, by: auto, when: [{ linked_pr: changes_requested }] }
      - { from: In review, to: Done, by: auto, when: [{ issue_closed_by_pr: true }] }

  QATask:
    initial: Ready
    blocked_returns_to: Testing
    transitions:
      - { from: Ready, to: In progress, by: coordinator }
      - {
          from: In progress,
          to: Testing,
          by: auto,
          when: [{ siblings_done: [DesignTask, DevTask] }],
        }
      - {
          from: Blocked,
          to: Testing,
          by: auto,
          when: [{ blockers_done: true }, { no_open_sibling: [Bug] }],
        }
      - { from: Testing, to: [Blocked, Done], by: coordinator }

  Bug:
    initial: Draft
    transitions:
      - { from: Draft, to: [Ready, Awaiting PO], by: coordinator }
      - { from: Awaiting PO, to: [Ready, Done, Rework], by: po }
      - { from: Rework, to: Awaiting PO, by: coordinator }
      - { from: Ready, to: In progress, by: auto, when: [{ any_child_in: [In progress] }] }
      - { from: In progress, to: Testing, by: auto, when: [{ children_done: [DevTask] }] }
      - { from: Testing, to: Done, by: auto, when: [{ children_done: [QATask] }] }
      - { from: Testing, to: In progress, by: coordinator }

  ADR:
    initial: Draft
    transitions:
      - { from: Draft, to: [Done, Awaiting PO], by: coordinator }
      - { from: Awaiting PO, to: [Done, Rework], by: po }
      - { from: Rework, to: Awaiting PO, by: coordinator }

  Doc:
    initial: Draft
    transitions:
      - { from: Draft, to: [Ready, Awaiting PO], by: coordinator }
      - { from: Awaiting PO, to: [Ready, Rework], by: po }
      - { from: Ready, to: Awaiting PO, by: coordinator }
      - { from: Rework, to: Awaiting PO, by: coordinator }
