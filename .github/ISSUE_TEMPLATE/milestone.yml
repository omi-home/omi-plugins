# OMI Issue Form (DevTask-0047 #130). Required fields are the sections `omi ticket validate` checks.
name: Milestone
description: Mốc giao hàng gồm Feature/task, đóng khi PO chấp nhận gate.
title: Milestone-NNNN-
labels:
  - type:milestone
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Kết quả cần đạt, một hai câu.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Parent
      description: Issue cha (sẽ gắn native sub-issue), bối cảnh, link quyết định.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope / Acceptance
      description: Phạm vi và Acceptance Criteria dạng checklist `- [ ]`.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue chặn (native blocked-by link).
      value: "Blocked by: none"
    validations:
      required: false
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Điều kiện để đóng Issue.
      value: |-
        - [ ] Mọi Issue con đóng
        - [ ] PO chấp nhận gate
    validations:
      required: false
