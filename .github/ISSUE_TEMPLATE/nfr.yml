# OMI Issue Form (DevTask-0047 #130). Required fields are the sections `omi ticket validate` checks.
name: NonFunctionalRequirement
description: Yêu cầu phi chức năng có ngưỡng đo.
title: NonFunctionalRequirement-NNNN-
labels:
  - type:nfr
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Kết quả cần đạt, một hai câu.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Parent
      description: Issue cha (sẽ gắn native sub-issue), bối cảnh, link quyết định.
    validations:
      required: false
  - type: textarea
    id: threshold
    attributes:
      label: Threshold
      description: Ngưỡng đo được (ví dụ p95 < 200 ms, 0 lỗi lint).
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "Cách xác minh ngưỡng: lệnh, test, công cụ đo."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Acceptance
      description: Phạm vi và Acceptance Criteria dạng checklist `- [ ]`.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue chặn (native blocked-by link).
      value: "Blocked by: none"
    validations:
      required: false
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Điều kiện để đóng Issue.
      value: "- [ ] Ngưỡng được xác minh, có bằng chứng"
    validations:
      required: false
