# OMI Issue Form (DevTask-0047 #130). Required fields are the sections `omi ticket validate` checks.
name: Bug
description: Lỗi so với hành vi mong đợi; sửa qua DevTask/TestTask con.
title: Bug-NNNN-
labels:
  - type:bug
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Kết quả cần đạt, một hai câu.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Parent
      description: Issue cha (sẽ gắn native sub-issue), bối cảnh, link quyết định.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Các bước reproduce, từng bước một.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Hành vi mong đợi.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Hành vi thực tế (log, ảnh chụp).
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Mức độ ảnh hưởng.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Phiên bản, OS, cấu hình.
    validations:
      required: false
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Điều kiện để đóng Issue.
      value: |-
        - [ ] Task sửa lỗi đã merge
        - [ ] Đã xác minh không còn reproduce
    validations:
      required: false
